name: Android build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build phone and Wear APKs
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android platform and NDK
        run: |
          sdkmanager --install "platforms;android-28" "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Build native PTY libraries
        run: ./scripts/build-native-pty.sh

      - name: Assemble debug APKs
        working-directory: source/WearBridgeADB
        run: ./gradlew --no-daemon :Application:assembleDebug :Wearable:assembleDebug

      - name: Publish APK build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: WearBridge-debug-${{ github.sha }}
          path: |
            source/WearBridgeADB/Application/build/outputs/apk/debug/Application-debug.apk
            source/WearBridgeADB/Wearable/build/outputs/apk/debug/Wearable-debug.apk
          if-no-files-found: error
          retention-days: 14
